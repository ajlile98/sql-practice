version: 1
as_of: '2025-03-01'
tables:
  customers:
    columns:
      id: {type: integer, primary_key: true}
      name: {type: text}
      region: {type: text, nullable: true}
      joined_on: {type: date}
  products:
    columns:
      id: {type: integer, primary_key: true}
      name: {type: text}
      category: {type: text}
  orders:
    columns:
      id: {type: integer, primary_key: true}
      customer_id: {type: integer, references: customers.id}
      ordered_on: {type: date}
      status: {type: text}
      total_cents: {type: integer}
  order_items:
    columns:
      id: {type: integer, primary_key: true}
      order_id: {type: integer, references: orders.id}
      product_id: {type: integer, references: products.id}
      quantity: {type: integer}
      unit_price_cents: {type: integer}