[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-practice"
version = "0.1.0"
description = "Local, multi-engine SQL practice with deterministic grading"
requires-python = ">=3.10"
dependencies = ["typer>=0.15,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pymysql>=1.1,<2", "pyyaml>=6,<7", "sqlparse>=0.5,<1", "rich>=13,<15", "streamlit>=1.45,<2", "pandas>=2.2,<4"]

[project.scripts]
sql-practice = "sql_practice.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: controlled local database integration tests"]

[tool.coverage.run]
source = ["sql_practice"]

[tool.ruff]
target-version = "py310"
line-length = 100
